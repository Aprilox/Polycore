# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environnement
minecraft_version=1.20.1
minecraft_version_range=[1.20,1.20.1]
loader_version_range=[46,)
# Forge
forge_version=47.4.28
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=17
publish_release_type=alpha
forge_publish_versions=1.20,1.20.1

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.92.12+1.20.1
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.20 <=1.20.1
fabric_publish_versions=1.20,1.20.1
# The Forge jar also runs on NeoForge 1.20.1 (Forge 47.1 fork): smoke test passed on NeoForge 47.1.106
forge_extra_loaders=neoforge
