# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.21.8
parchment_mappings_version=2025.09.14

# Environnement
minecraft_version=1.21.8
minecraft_version_range=[1.21.8]
neo_minecraft_version_range=[1.21.7,1.21.8]
neo_version_range=[21.7.25-beta,)
neo_version=21.8.57
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=1.21.8-20250717.133445
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.136.1+1.21.8
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.21.6 <=1.21.8
# Forge
forge_version=58.1.26
# Forge 56/57 (1.21.6/1.21.7) have no AddGuiOverlayLayersEvent (client crash); NeoForge 21.6 has no ClientPacketDistributor
forge_version_range=[58.1.26,)
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=21
publish_release_type=release
neoforge_publish_versions=1.21.7,1.21.8
fabric_publish_versions=1.21.6,1.21.7,1.21.8
forge_publish_versions=1.21.8
