# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.21.4
parchment_mappings_version=2025.03.23

# Environnement
minecraft_version=1.21.4
minecraft_version_range=[1.21.4]
neo_minecraft_version_range=[1.21.4]
neo_version_range=[21.4.0,)
neo_version=21.4.161
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=1.21.4-20241203.161809
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.119.4+1.21.4
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.21.4 <=1.21.4
# Forge
forge_version=54.1.8
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=21
publish_release_type=alpha
neoforge_publish_versions=1.21.4
fabric_publish_versions=1.21.4
forge_publish_versions=1.21.4
