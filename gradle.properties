# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environnement
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.1]
neo_minecraft_version_range=[1.21,1.21.1]
neo_version_range=[21.0,)
neo_version=21.1.265
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=1.21.1-20240808.144430
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.21 <=1.21.1
# Forge
forge_version=52.1.21
# Oldest Forge accepted (mods.toml): 52 = Minecraft 1.21.1 (Forge 51 for 1.21 lacks the mod constructor with its context)
forge_version_range=[51,)
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=21
publish_release_type=alpha
neoforge_publish_versions=1.21,1.21.1
fabric_publish_versions=1.21,1.21.1
forge_publish_versions=1.21,1.21.1
