# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Environnement
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_minecraft_version_range=[1.21.11]
neo_version_range=[21.11.48,)
neo_version=21.11.48
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=1.21.11-20251209.172050
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.141.6+1.21.11
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.21.11 <=1.21.11
# Forge
forge_version=61.2.5
# Forge tested on a real server (1.21.11)
forge_version_range=[61.2.5,)
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=21
publish_release_type=release
neoforge_publish_versions=1.21.11
fabric_publish_versions=1.21.11
forge_publish_versions=1.21.11
