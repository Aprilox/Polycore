# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environnement
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.2]
neo_minecraft_version_range=[26.1,26.1.2]
neo_version_range=[26.1.0.19-beta,)
neo_version=26.1.2.126
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=26.1.2-1
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=26.1 <=26.1.2
# Forge
forge_version=64.1.6
# Forge tested on a real server (26.1: 62.0.9)
forge_version_range=[62.0.9,)
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=25
publish_release_type=release
neoforge_publish_versions=26.1,26.1.1,26.1.2
fabric_publish_versions=26.1,26.1.1,26.1.2
forge_publish_versions=26.1,26.1.1,26.1.2
