# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.20.6
parchment_mappings_version=2024.06.16

# Environnement
minecraft_version=1.20.6
minecraft_version_range=[1.20.6]
neo_minecraft_version_range=[1.20.5,1.20.6]
neo_version_range=[20.5,)
neo_version=20.6.144
# Vanilla Minecraft for the loader-independent "common" module (MDG neoFormVersion)
neo_form_version=1.20.6-20240627.102356
loader_version_range=[1,)
# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.100.8+1.20.6
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.20.5 <=1.20.6
# Forge
forge_version=50.2.15
# Oldest Forge accepted (mods.toml loaderVersion): 50 = Minecraft 1.20.6
forge_version_range=[50,)
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=21
publish_release_type=alpha
neoforge_publish_versions=1.20.5,1.20.6
fabric_publish_versions=1.20.5,1.20.6
forge_publish_versions=1.20.6
