# Memoire pour Gradle (la decompilation de Minecraft en a besoin)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Noms de parametres lisibles (Parchment)
parchment_minecraft_version=1.19.2
parchment_mappings_version=2022.11.27

# Environnement
minecraft_version=1.19.2
minecraft_version_range=[1.19.1,1.19.2]
loader_version_range=[42,)
# Forge
forge_version=43.5.2
mixinextras_version=0.4.1

## Proprietes du mod
mod_id=polycore
mod_name=Polycore
mod_license=All Rights Reserved (Polycore License, see LICENSE)
mod_version=0.5.0
mod_group_id=com.polycore

# Publishing (gradle/publish.gradle): release type and the Minecraft versions declared per loader on CurseForge and
# Modrinth (only versions where the real dedicated server smoke test passes, same as the metadata ranges above)
java_version=17
publish_release_type=release
forge_publish_versions=1.19.1,1.19.2

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.77.0+1.19.2
# Range in Fabric's syntax (fabric.mod.json)
fabric_minecraft_range=>=1.19.2 <=1.19.2
fabric_publish_versions=1.19.2
