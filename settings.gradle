pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// shortcut: Fabric and Forge come back in M13-b/M13-c (port to 1.21.11 in progress)
include 'common', 'neoforge'
