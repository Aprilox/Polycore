pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Minecraft 1.20.4: NeoForge and Fabric. forge/ waits for its own build (ModDevGradle Legacy stops at Forge 1.20.1).
include 'common', 'neoforge', 'fabric'
