pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Minecraft 1.20 - 1.20.1: Forge (its jar also runs on NeoForge 1.20.1, the Forge 47.1 fork) and Fabric.
include 'common', 'fabric', 'forge'
