name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every loader
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: polycore-jars
          path: |
            neoforge/build/libs/polycore-neoforge-*.jar
            fabric/build/libs/polycore-fabric-*.jar
            forge/build/libs/polycore-forge-*.jar
          if-no-files-found: ignore
