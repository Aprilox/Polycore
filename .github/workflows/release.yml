name: Release

# Tag v<mod_version> (main, newest Minecraft) or v<mod_version>+<minecraft> (mc/<version> branches).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag against gradle.properties
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag_version=${GITHUB_REF_NAME#v}
          tag_version=${tag_version%%+*}
          if [ "$tag_version" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build every loader
        run: |
          chmod +x gradlew && ./gradlew build --stacktrace
          # Forge 1.20.2 - 1.20.4: separate Gradle build (ForgeGradle 6)
          if [ -f forge/settings.gradle ]; then (cd forge && chmod +x gradlew && ./gradlew build --stacktrace); fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md" >&2; exit 1; fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jars=$(ls neoforge/build/libs/polycore-neoforge-*-"$VERSION".jar fabric/build/libs/polycore-fabric-*-"$VERSION".jar forge/build/libs/polycore-forge-*-"$VERSION".jar 2>/dev/null)
          [ -n "$jars" ] || { echo "No loader jar built" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" $jars --title "Polycore $GITHUB_REF_NAME" --notes-file notes.md
