// Forge 1.20.2 - 1.20.4: the code of ../common plus the Forge glue (com.polycore.forge), built by ForgeGradle 6 like
// the Forge 49 MDK. Forge before 1.20.6 runs on SRG names: the jar is reobfuscated and the mixins get a refmap.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.gradleup.shadow' version '8.3.9'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

// The mod's properties live in the branch's gradle.properties, shared with the main build.
def branchProps = new Properties()
file('../gradle.properties').withInputStream { branchProps.load(it) }
branchProps.each { k, v -> if (!project.hasProperty(k as String)) project.ext.set(k as String, v) }

version = mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

// Classes and resources in one folder, as in the Forge MDK: otherwise the dev runs load them as two modules
// ("Modules polycore and main export package ...").
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

def runRoot = file('../DEV_FILES').exists() ? '../DEV_FILES/run' : '../run'

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {
            workingDirectory file("${runRoot}/forgeClient")
        }
        server {
            workingDirectory file("${runRoot}/forgeServer")
            args '--nogui'
        }
        // Runs every Polycore game test, then exits (task runGameTestServer).
        gameTestServer {
            workingDirectory file("${runRoot}/forgeGameTestServer")
            // Applies the self-test mixin that plays "another mod" for the conflict detection test.
            property 'polycore.selftest', 'true'
            property 'forge.enableGameTest', 'true'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}-selftest.mixins.json"
}

repositories {
    mavenCentral()
}

// MixinExtras merged into the jar under Polycore's package (Forge 49.0.2, the only Forge 1.20.3, does not load a
// nested jarJar mod); com.polycore.forge.ForgeMixinPlugin starts it.
configurations { shade }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // @Nullable of common/
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Forge 49 does not ship MixinExtras: compiled against, run in dev (mixinextras-forge), merged into the jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    shade("io.github.llamalad7:mixinextras-common:${mixinextras_version}") { transitive = false }
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 minecraft_version_range: minecraft_version_range, forge_version: forge_version,
                 loader_version_range: loader_version_range, mixin_plugin: 'com.polycore.forge.ForgeMixinPlugin']
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
    // The Forge jar's own plugin also starts the merged MixinExtras (the other loaders bring theirs)
    filesMatching("${mod_id}.mixins.json") {
        filter { it.replace('com.polycore.mixin.PolyCoreMixinPlugin', props.mixin_plugin) }
    }
}

// util/Conflicts names Minecraft's methods the Mojang way; a production Forge 1.20.4 game uses SRG names (m_N_,
// class names unchanged). This writes polycore-spots.json (Mojang name -> SRG names) for the classes Conflicts
// watches, from the official -> SRG mappings ForgeGradle already made.
def spotsSource = file('../common/src/main/java/com/polycore/util/Conflicts.java')
def generateSpots = tasks.register('generatePolycoreSpots') {
    dependsOn 'createMcpToSrg'
    def tsrgFile = tasks.named('createMcpToSrg').flatMap { it.output }
    inputs.file(spotsSource)
    inputs.file(tsrgFile)
    def out = layout.buildDirectory.dir('generated/polycoreSpots')
    outputs.dir(out)
    doLast {
        // owner -> watched methods, from the `new Spot("owner", "m1", "m2")` lines
        def spots = [:]
        (spotsSource.text =~ /new Spot\(("[^)]*)\)/).each { m ->
            def args = (m[1] =~ /"([^"]+)"/).collect { it[1] }
            spots[args[0]] = args.drop(1)
        }
        // "named srg" class lines, then "	name desc srg" method lines
        def classes = [:], declared = [:], anywhere = [:], current = null
        tsrgFile.get().asFile.eachLine { line ->
            def p = line.split(/\s+/)
            if (!line.startsWith('\t')) {
                current = p[0]
                classes[current] = p[1]
            } else if (current && p.length == 4 && p[2].startsWith('(')) {
                declared.computeIfAbsent("$current.${p[1]}" as String) { [] as Set } << p[3]
                anywhere.computeIfAbsent(p[1]) { [] as Set } << p[3]
            }
        }
        def table = [:]
        spots.each { owner, methods ->
            if (!classes[owner]) throw new GradleException("Mappings miss the class $owner of Conflicts")
            def ms = [:]
            methods.findAll { it != '*' }.each { m ->
                // An override is listed only under the class declaring it first (Mob.serverAiStep is LivingEntity's).
                def names = declared["$owner.$m" as String] ?: anywhere[m]
                if (!names) throw new GradleException("Mappings miss the method $owner.$m of Conflicts")
                ms[m] = names
            }
            table[owner] = [name: classes[owner], methods: ms]
        }
        def dir = out.get().asFile
        dir.mkdirs()
        new File(dir, 'polycore-spots.json').text = groovy.json.JsonOutput.toJson(table)
    }
}
sourceSets.main.resources.srcDir generateSpots

// The production jar is the shadow jar (MixinExtras merged and relocated), reobfuscated in place to SRG names; the
// plain jar is "slim".
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'com.llamalad7.mixinextras', 'com.polycore.shadow.mixinextras'
    exclude 'META-INF/maven/**', 'module-info.class', 'META-INF/services/javax.annotation.processing.Processor'
}
reobf { shadowJar {} }
tasks.named('shadowJar') { finalizedBy 'reobfShadowJar' }
tasks.named('assemble') { dependsOn 'shadowJar' }
// shadowJar always reruns (its output is rewritten in place): fixed timestamps and order keep the jar's sha1 stable
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
// Forge finds a mod's mixin configs in its manifest only (the dev runs get them as arguments from mixin {}).
// The self-test config stays out of the jar's list: it plays another mod in game tests only.
tasks.withType(Jar).configureEach { manifest.attributes('MixinConfigs': "${mod_id}.mixins.json") }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../gradle/publish.gradle')
