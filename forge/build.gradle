// Forge loader: the code of common/ plus the Forge glue (com.polycore.forge). ForgeGradle 7, as in Forge's 26.3 MDK (no mappings line: the game ships unobfuscated since 26.1).
// Forge runs on Mojang names since 1.20.6: the mixins need no refmap and util/Conflicts uses its Mojang names.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

version = mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
// Test instances and environments of the game tests (dev runs only: excluded from the jar below, because the
// test_instance registry is sent to clients).
sourceSets.main.resources.srcDir 'src/gametest/resources'
// Forge's dev bootstrap turns each classpath folder into its own module: classes and resources must share one
// folder, otherwise "Modules polycore and main export package ..." (same fix as Forge's 1.20.6+ MDK).
def mergedOutput = layout.buildDirectory.dir('sourcesSets/main')
sourceSets.main.output.resourcesDir = mergedOutput
sourceSets.main.java.destinationDirectory = mergedOutput

def runRoot = rootProject.file('DEV_FILES').exists() ? 'DEV_FILES/run' : 'run'
def mixinArgs = ['--mixin.config', "${mod_id}.mixins.json", '--mixin.config', "${mod_id}-selftest.mixins.json"]

minecraft {
    runs {
        configureEach {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args mixinArgs
        }
        register('client') {
            workingDir = rootProject.layout.projectDirectory.dir("${runRoot}/forgeClient")
        }
        register('server') {
            workingDir = rootProject.layout.projectDirectory.dir("${runRoot}/forgeServer")
            args '--nogui'
        }
        // Runs every Polycore game test, then exits (task runGameTestServer).
        register('gameTestServer') {
            workingDir = rootProject.layout.projectDirectory.dir("${runRoot}/forgeGameTestServer")
            // Applies the self-test mixin that plays "another mod" for the conflict detection test.
            systemProperty 'polycore.selftest', 'true'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

configurations { nested { transitive = false } }

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // @Nullable of common/
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Forge 52 does not ship MixinExtras: compiled against, run in dev, and nested in the jar (below).
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    implementation "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    nested "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

// ForgeGradle 7 has no jarJar: write Forge's JarJar layout (META-INF/jarjar/ + metadata.json) by hand.
def mixinextrasVersion = mixinextras_version
def jarJarMetadata = tasks.register('jarJarMetadata') {
    def out = layout.buildDirectory.file('generated/jarjar/META-INF/jarjar/metadata.json')
    inputs.property('version', mixinextrasVersion)
    outputs.file(out)
    doLast {
        def json = groovy.json.JsonOutput.toJson([jars: [[
                identifier: [group: 'io.github.llamalad7', artifact: 'mixinextras-forge'],
                version: [range: "[${mixinextrasVersion},)", artifactVersion: mixinextrasVersion],
                path: "META-INF/jarjar/mixinextras-forge-${mixinextrasVersion}.jar",
                isObfuscated: false]]])
        out.get().asFile.text = groovy.json.JsonOutput.prettyPrint(json)
    }
}

jar {
    // Forge reads the mixin configs of a mod jar from its manifest.
    exclude 'data/polycore/test_instance/**', 'data/polycore/test_environment/**'
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}-selftest.mixins.json")
    from(configurations.nested) { into 'META-INF/jarjar' }
    from(jarJarMetadata.map { layout.buildDirectory.dir('generated/jarjar').get() })
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: rootProject.file('gradle/publish.gradle')
