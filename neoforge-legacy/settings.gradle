// NeoForge 1.20.2 - 1.20.3: a build of its own (NeoForge 20.2 / 20.3 predate ModDevGradle's bundle; NeoGradle 7, as
// in their MDK, needs Gradle 8). It compiles ../common with the NeoForge glue and reads ../gradle.properties.
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'neoforge-legacy'
