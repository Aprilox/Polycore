# Builds Polycore on every push and pull request and keeps the jar as a downloadable artifact.
name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check loader independence
        run: |
          if grep -rl "net.neoforged" src/main/java --include=*.java | grep -v /neoforge/; then
            echo "::error::Only com.polycore.neoforge may import net.neoforged"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: polycore-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
