# Publishes a GitHub Release with the compiled jar when a version tag is pushed.
#
#   1. Set mod_version in gradle.properties (e.g. 0.3.0) and commit.
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# The tag must match mod_version, otherwise the release fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches mod_version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag v$tag does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Polycore ${{ steps.version.outputs.version }} (NeoForge ${{ steps.version.outputs.mc }})
          files: build/libs/polycore-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
