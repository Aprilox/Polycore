// Fabric loader: the code of common/ plus the Fabric glue (com.polycore.fabric). 26.x is not obfuscated: no remapping.
plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom'
}

version = mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // @Nullable of common/ (NeoForge has it on its classpath, Fabric does not)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

loom {
    runs {
        // Runs every Polycore game test on a game test server, then exits (task runGametest).
        gametest {
            server()
            name = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            // Applies the self-test mixin that plays "another mod" for the conflict detection test.
            vmArg '-Dpolycore.selftest=true'
            runDir = "../${rootProject.file('DEV_FILES').exists() ? 'DEV_FILES/run' : 'run'}/fabricGametest"
        }
    }
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 fabric_minecraft_range: fabric_minecraft_range]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// No polycore-spots.json: a production 26.x game keeps Mojang's names, which util/Conflicts uses.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: rootProject.file('gradle/publish.gradle')
